name: learnhouse-nas

services:
  learnhouse-app:
    image: ghcr.io/learnhouse/app:1.3.6
    container_name: learnhouse-app-nas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
      - LEARNHOUSE_API_URL=http://localhost:9000
    volumes:
      # bind mount 而非 named volume：课程视频/图片体积大，放在
      # /volume1/docker/learnhouse/data/content 下便于 Hyper Backup 备份
      - ./data/content:/app/api/content
      # PATCH(nas): 覆盖镜像内两个 .py —— 见 patches/README.md
      #   generator.py      生图改走 OpenAI 兼容接口(硅基流动)，原版硬编码 Google-only
      #   courseplanning.py 修复 "zh-CN" 匹配不到语言表而回落 English 的问题
      # 升级镜像后必须重新核对这两个文件与新版的差异！
      - ./patches/generator.py:/app/api/src/services/ai/image/generator.py:ro
      - ./patches/courseplanning.py:/app/api/src/services/ai/courseplanning.py:ro
      #   magic_login.py    登录邮件中文化 + 品牌名
      - ./patches/magic_login.py:/app/api/src/services/auth/magic_login.py:ro
      # PATCH(nas): 中文语言包去品牌化。只替换学生可见的品牌文案（登录页条款、
      #   版权行、欢迎语等），保留导入格式名、环境变量名、水印设置说明等技术标识，
      #   版权行改为「本平台名 · 基于 LearnHouse 构建（AGPL-3.0）」以保留上游归属。
      #   zh.json 供服务端使用；chunk 是客户端懒加载的编译产物。
      # !! chunk 文件名由构建产物决定，升级镜像后这条挂载会静默失效，必须重新确认文件名：
      #    docker exec learnhouse-app-nas grep -rl '大学' /app/web/.next/static/chunks/
      - ./patches/web/zh.json:/app/web/locales/zh.json:ro
      - ./patches/web/zh.chunk.js:/app/web/.next/static/chunks/3bdcaw90zbhgi.js:ro
      # PATCH(nas): 修复「新建作业」弹窗对任何课程都显示"此课程尚无章节"（上游 1.3.6 缺陷，main 仍未修）。
      #   原因：弹窗剥掉 course_ 前缀后调 GET /courses/{uuid} → 404；且该接口返回 CourseRead，本就不含 chapters。
      #   改为请求 /courses/course_{uuid}/meta?slim=true（FullCourseRead，含章节，与课程编辑器同源）。
      # !! 同样是构建产物文件名，升级镜像后需重新定位：
      #    docker exec learnhouse-app-nas grep -rl assignment-course-structure /app/web/.next/static/chunks/
      - ./patches/web/assign.chunk.js:/app/web/.next/static/chunks/1xclx_yg371wb.js:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learnhouse-network-nas
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 6
      # 这台 NAS 只有 4G 内存且在用 swap，首次启动要跑数据库迁移，
      # 官方默认 60s 不够，放宽到 180s，否则 app 会被判 unhealthy 导致 nginx 起不来
      start_period: 180s

  nginx:
    image: nginx:alpine
    container_name: learnhouse-nginx-nas
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./extra/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      learnhouse-app:
        condition: service_healthy
    networks:
      - learnhouse-network-nas
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  ssr-fwd:
    image: alpine/socat:1.8.0.0
    container_name: learnhouse-ssr-fwd-nas
    restart: unless-stopped
    network_mode: "service:learnhouse-app"
    command: TCP-LISTEN:8088,fork,reuseaddr TCP:localhost:80
    depends_on:
      learnhouse-app:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: learnhouse-db-nas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-learnhouse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-learnhouse}
      - POSTGRES_DB=${POSTGRES_DB:-learnhouse}
    volumes:
      - learnhouse_db_data_nas:/var/lib/postgresql/data
    networks:
      - learnhouse-network-nas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnhouse}"]
      interval: 5s
      timeout: 4s
      retries: 5

  redis:
    image: redis:7.2.3-alpine
    container_name: learnhouse-redis-nas
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - learnhouse_redis_data_nas:/data
    networks:
      - learnhouse-network-nas
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5

networks:
  learnhouse-network-nas:
    driver: bridge
    ipam:
      config:
        # 显式钉死子网。NAS 所在 LAN 是 172.25.4.0/22，而 Docker 默认地址池
        # 172.17.0.0/12 覆盖了 172.25.x —— 若让 Docker 自动分配，将来可能
        # 分到与校园网重叠的网段，导致 NAS 在局域网内失联。
        - subnet: 172.20.0.0/24

volumes:
  learnhouse_db_data_nas:
  learnhouse_redis_data_nas:
