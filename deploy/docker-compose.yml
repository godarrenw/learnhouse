name: learnhouse-nas

services:
  learnhouse-app:
    # 自建镜像：由本仓库 .github/workflows/build-image.yml 从 sysu-sam 分支源码构建
    # （linux/amd64，NAS 是 x86_64）。5 条补丁已在源码里，不再需要任何 bind-mount。
    # 要钉死某次构建就换成 :sysu-sam-<sha7>；打 sysu-v* tag 时会额外出一个版本 tag。
    image: ghcr.io/godarrenw/learnhouse:sysu-sam
    container_name: learnhouse-app-nas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
      - LEARNHOUSE_API_URL=http://localhost:9000
    volumes:
      # bind mount 而非 named volume：课程视频/图片体积大，放在
      # /volume1/docker/learnhouse/data/content 下便于 Hyper Backup 备份
      - ./data/content:/app/api/content
      # 原先这里有 5 条 patch bind-mount（generator.py / courseplanning.py /
      # magic_login.py / zh.json + zh.chunk.js / assign.chunk.js），把改动覆盖进镜像。
      # 换自建镜像后全部删除 —— 这些改动已作为源码提交在 sysu-sam 分支上，
      # 补丁到 commit 的映射见 docs/sysu-sam/PATCHES.md。
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learnhouse-network-nas
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 6
      # 这台 NAS 只有 4G 内存且在用 swap，首次启动要跑数据库迁移，
      # 官方默认 60s 不够，放宽到 180s，否则 app 会被判 unhealthy 导致 nginx 起不来
      start_period: 180s

  nginx:
    image: nginx:alpine
    container_name: learnhouse-nginx-nas
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./extra/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      learnhouse-app:
        condition: service_healthy
    networks:
      - learnhouse-network-nas
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # cloudflared —— Cloudflare Tunnel 出站连接器（阶段一新增）
  #
  # NAS 不需要任何公网入站端口：容器主动建立出站 443 连接到 CF 边缘，
  # 用户流量由 CF 沿这条连接回灌到 learnhouse-nginx-nas:80。
  #
  # token 里已经包含隧道 id 与凭据，**只写在 .env 的 CF_TUNNEL_TOKEN，不要写进本文件**
  # （本文件入 git，.env 不入）。token 泄露等于把隧道交出去，泄露后到 Zero Trust
  # 控制台 Refresh token 即可作废旧的。
  #
  # 版本钉死不用 latest：隧道断了要能确定是不是升级引入的。当前 tag 2026.9.0
  # （2026-09-09 发布，多架构 manifest 含 amd64，NAS 是 x86_64）。
  # 升级方式：改这里的 tag -> docker-compose pull cloudflared ->
  #           docker-compose up -d --force-recreate cloudflared。
  #
  # 注意几件事：
  #   - depends_on 只挂 nginx。它按容器名/服务名解析 nginx，nginx 一旦被重建，
  #     IP 会变，cloudflared 需要跟着重建（compose 不会自动连带重建 dependents）。
  #     部署脚本里 nginx 与 cloudflared 要一起 --force-recreate，见 DEPLOY.md。
  #   - 没有 healthcheck（cloudflared 镜像里没有 shell 也没有 curl）。
  #     **不要**把它加进 deploy.sh 的 HEALTHY_CONTAINERS，否则预检永远过不了。
  #     验隧道状态看 `docker logs learnhouse-cloudflared-nas` 里的
  #     "Registered tunnel connection"，或 Zero Trust 控制台的 HEALTHY 标记。
  #   - Public hostname 的 Service 要填 http://learnhouse-nginx-nas:80，
  #     **不要填 8088** —— 那是宿主机映射端口，容器网络里不存在。
  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    container_name: learnhouse-cloudflared-nas
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    env_file:
      - .env
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - learnhouse-network-nas
    # NAS 只有 4G 内存且在用 swap，给它设个上限免得意外吃内存。
    # cloudflared 常驻约 20~40MB，256m 很宽松。
    mem_limit: 256m

  ssr-fwd:
    image: alpine/socat:1.8.0.0
    container_name: learnhouse-ssr-fwd-nas
    restart: unless-stopped
    network_mode: "service:learnhouse-app"
    command: TCP-LISTEN:8088,fork,reuseaddr TCP:localhost:80
    depends_on:
      learnhouse-app:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    container_name: learnhouse-db-nas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-learnhouse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-learnhouse}
      - POSTGRES_DB=${POSTGRES_DB:-learnhouse}
    volumes:
      - learnhouse_db_data_nas:/var/lib/postgresql/data
    networks:
      - learnhouse-network-nas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnhouse}"]
      interval: 5s
      timeout: 4s
      retries: 5

  redis:
    image: redis:7.2.3-alpine
    container_name: learnhouse-redis-nas
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - learnhouse_redis_data_nas:/data
    networks:
      - learnhouse-network-nas
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5

networks:
  learnhouse-network-nas:
    driver: bridge
    ipam:
      config:
        # 显式钉死子网。NAS 所在 LAN 是 172.25.4.0/22，而 Docker 默认地址池
        # 172.17.0.0/12 覆盖了 172.25.x —— 若让 Docker 自动分配，将来可能
        # 分到与校园网重叠的网段，导致 NAS 在局域网内失联。
        - subnet: 172.20.0.0/24

volumes:
  learnhouse_db_data_nas:
  learnhouse_redis_data_nas:
