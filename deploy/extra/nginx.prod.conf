server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 必须与 app 容器内层 nginx 的 6G 一致，否则大视频上传会在外层就 413
    client_max_body_size 6G;

    large_client_header_buffers 4 32k;
    client_body_buffer_size 32k;
    client_header_buffer_size 32k;

    # 原先这里有一段针对两个补丁 chunk（3bdcaw90zbhgi / 1xclx_yg371wb）的 no-cache
    # location：补丁改的是编译产物、文件名与原版相同，而上游对 /_next/static 下发
    # max-age=31536000, immutable，浏览器一年内不回源，补丁到不了已访问过的用户。
    # 换自建镜像后补丁在源码里，构建出的 chunk 文件名（内容哈希）必然是新的，
    # immutable 缓存不再有害，这段已删除。

    location / {
        proxy_pass http://learnhouse-app:80;
        # 用 $http_host 而不是 $host，保留端口：
        # Next.js Server Actions 会拒绝 origin 与 x-forwarded-host 不一致的 POST
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /collab 白板协作需要 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 75s;
    }
}
