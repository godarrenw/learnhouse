server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 必须与 app 容器内层 nginx 的 6G 一致，否则大视频上传会在外层就 413
    client_max_body_size 6G;

    large_client_header_buffers 4 32k;
    client_body_buffer_size 32k;
    client_header_buffer_size 32k;

    # PATCH(nas): 打过补丁的前端构建产物（见 patches/README.md）文件名与原版相同，
    # 而上游对 /_next/static 下发 "max-age=31536000, immutable"，浏览器拿到旧版后一年内
    # 不会回源，补丁永远到不了已访问过的用户。对这几个文件改为 no-cache：
    # 每次带 ETag 回源校验，未变化时返回 304，开销很小。新增补丁 chunk 时把文件名加进来。
    location ~ ^/_next/static/chunks/(3bdcaw90zbhgi|1xclx_yg371wb)\.js$ {
        proxy_pass http://learnhouse-app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://learnhouse-app:80;
        # 用 $http_host 而不是 $host，保留端口：
        # Next.js Server Actions 会拒绝 origin 与 x-forwarded-host 不一致的 POST
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /collab 白板协作需要 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 75s;
    }
}
