# =============================================================================
# 先进智造学堂 · 外层 nginx（NAS 上的 learnhouse-nginx-nas，宿主机端口 8088）
#
# 两个 server 块：
#   learn.sysu-sam.com   用户可见域名，经 Cloudflare Tunnel 出去。**必须是
#                        default_server**，见下方「为什么 default_server 不是可选」。
#   media.sysu-sam.com   内部媒体域名，灰云 A 记录指向 172.25.5.162，只在校园网可达。
#                        只服务重媒体路径（视频 / 音频 / PDF），其余一律 404。
#
# ⚠️ 分流**不再靠 302 重定向**。原方案是前端照旧拼 learn 域名地址、由这里按路径
# 302 到 media 域名，前端零改动。集成审查把它否掉了：单租户模式下 LH_access 是
# host-only cookie（前端 services/auth/cookies.ts 的 getCookieDomain 在
# tenancy=single 时返回 undefined），跟不到 media 子域，非公开课程的媒体一到那边
# 就是 401/403；而 <video src> / <iframe src> 又发不出 Authorization 头，没法补救。
#
# 现在的做法：**前端直接生成 media 域名的地址，并带上限时签名**
# （apps/web/services/media/useSignedMediaUrls.ts ->
#  GET /api/v1/ext/media/sign -> apps/api/src/services/ext/media_sign/）。
# 所以 learn 块**不需要重定向任何东西**，下面那个总闸默认 off，只作应急保留。
#
# 设计依据：/Volumes/D/code/learnhouse-agent/TUNNEL_MEDIA_DESIGN.md §5.1、§7、§8
# 上线步骤：deploy/TUNNEL_RUNBOOK.md
# 本地验证：deploy/TUNNEL_LOCAL_TEST.md
# =============================================================================


# ---------------------------------------------------------------------------
# 302 分流总闸 —— **默认 off，正常情况下不要打开**。
#
# 媒体分流现在由前端 + 签名 URL 完成（见文件顶部说明），这个 302 是被否掉的旧方案。
# 留着只有一个用途：万一前端的签名链路出问题、又必须让媒体走 media 域名，
# 可以临时打开它顶一下 —— 但要清楚它只对**公开课程**有效，非公开课程会 401。
# 改完必须 `docker-compose up -d --force-recreate nginx`：本文件是单文件
# bind-mount，Docker 钉的是宿主机上那个 inode，reload / restart 都读不到新内容。
# ---------------------------------------------------------------------------
map $host $media_split_enabled {
    default  "off";          # <<<<<< 这一行就是开关：off / on
}

# 只有当请求确实是以 learn 域名到达时才分流 —— 正向白名单，不是「排除 media」。
# 理由：DSM 反向代理有可能把 Host 改写成 localhost 或 IP（TUNNEL_MEDIA_DESIGN §10 第 7 项
# 仍是待核对项）。若用「$host != media 就重定向」的负向写法，那种情况下 media 域名的
# 请求会落到 learn 块且 $host 不等于 media，于是被无限 302 到自己。正向白名单下
# 最坏情况只是「分流静默不生效」，不会成环。健康检查（Host: 127.0.0.1）与
# lh CLI 直连 IP 也因此天然不触发重定向。
map $host $media_split_host {
    default              "off";
    learn.sysu-sam.com   "on";
}

# 哪些路径算「重媒体」。路径取自 fork 源码，不是照抄设计文档的示意：
#   apps/web/services/media/media.ts
#     getActivityMediaDirectory        -> /content/orgs/…/activities/…/video|documentpdf/…
#     getActivityBlockMediaDirectory   -> /content/orgs/…/activities/…/dynamic/blocks/
#                                          pdfBlock|videoBlock|audioBlock/…
#                                        （imageBlock 刻意不在列，见下）
#     getActivity/VideoBlock/AudioBlock StreamUrl 等 -> /api/v1/stream/…
#   apps/api/src/routers/stream.py 里全部路由都在 /api/v1/stream/ 之下，
#   且只有 @router.get / @router.head，没有任何 POST/PUT，所以不用按方法区分。
#
# 刻意**不**分流的东西（校外用户仍然要能看到）：
#   - 图片块 imageBlock、课程封面、各类缩略图、机构 logo/favicon、用户头像
#   - 作业参考文件 assignments/…/tasks/…、参考答案 …/solution/…
#   - 学生提交文件 …/tasks/…/subs/…（要鉴权，而 LH_access 是 host-only cookie，
#     搬到 media 域名会 401；教师在校外批改要用它。见设计文档 §4）
#   - 上传接口 /api/v1/activities/…、/api/v1/blocks/…（POST，天然不在 /stream/ 下）
#
# `~` 是大小写敏感匹配，videoBlock / pdfBlock / audioBlock 的驼峰必须一字不差。
map $uri $media_path_hit {
    default  0;
    "~^/api/v1/stream/"                                                                          1;
    "~^/content/orgs/[^/]+/courses/[^/]+/activities/[^/]+/(video|documentpdf)/"                   1;
    "~^/content/orgs/[^/]+/courses/[^/]+/activities/[^/]+/dynamic/blocks/(pdfBlock|videoBlock|audioBlock)/"  1;
}

# 三个条件都成立才给出目标主机名；否则是空串（nginx 里空串为假）。
# map 的取值不做变量插值，所以这里只能放主机名，协议与路径在 return 里拼。
map "$media_split_enabled:$media_split_host:$media_path_hit" $media_redirect_host {
    default      "";
    "on:on:1"    "media.sysu-sam.com";
}


# =============================================================================
# server 1：learn.sysu-sam.com —— 用户可见域名
#
# 为什么 default_server 不是可选：
#   nginx 容器的健康检查是 `wget --spider http://127.0.0.1/`（docker-compose.yml），
#   Host 是 127.0.0.1，两个 server_name 都匹配不上，会落到 default server。
#   若 media 块意外成了 default，健康检查拿到 404 -> nginx 判 unhealthy ->
#   容器被反复重启。
#   另外，隧道复用的是 NAS 上已有的 SZ_NAS（cloudflared 容器在本 compose 之外），
#   它按 `http://172.25.5.162:8088` 回源，Host 由 CF 侧的 httpHostHeader 设成
#   learn.sysu-sam.com；万一哪天那一项没配上，请求会带着别的 Host 进来，
#   也是靠 default_server 兜住。
#   所以 learn 块显式 default_server，media 块**绝不能**加这个标记。
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name learn.sysu-sam.com;

    # 必须与 app 容器内层 nginx 的 6G 一致，否则大视频上传会在外层就 413。
    # 注意：橙云之后 Cloudflare 免费/Pro 版有 100 MB 请求体硬上限，这里写多大都没用，
    # 经 learn 域名的上传超过 100 MB 一律 413。缓解办法见 TUNNEL_RUNBOOK.md。
    client_max_body_size 6G;

    large_client_header_buffers 4 32k;
    client_body_buffer_size 32k;
    client_header_buffer_size 32k;

    # 重媒体分流。写在 server 级而不是 location 里：server 级的 if + return 在
    # rewrite 阶段就短路了，完全不与 proxy_pass 发生「if is evil」那类交互。
    # $request_uri 保留原始 query string（视频播放器会带 ?t= 之类参数）。
    if ($media_redirect_host) {
        return 302 https://$media_redirect_host$request_uri;
    }

    location / {
        proxy_pass http://learnhouse-app:80;
        # 用 $http_host 而不是 $host，保留端口：
        # Next.js Server Actions 会拒绝 origin 与 x-forwarded-host 不一致的 POST
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto 保持 $scheme（今天是 http，因为 DSM->8088 是明文）。
        # 隧道后情况完全相同，**不要顺手改成 https**：后端 is_request_secure()
        # 会跟着变，cookie 的 Secure 属性目前靠 LEARNHOUSE_SSL /
        # NEXT_PUBLIC_LEARNHOUSE_HTTPS 兜底，改这里会把登录搞坏。
        proxy_set_header X-Forwarded-Proto $scheme;

        # /collab 白板协作需要 WebSocket（经 Cloudflare Tunnel 正常透传）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 75s;
    }
}


# =============================================================================
# server 2：media.sysu-sam.com —— 内部媒体域名
#
# 只服务重媒体路径 + 一个健康探测端点，其余 404。
# 绝对不要给它加 default_server（理由见上）。
#
# 关于真实客户端 IP（设计文档 §8.1，按「复用 SZ_NAS 隧道」的实际拓扑修正过）：
#   这里**刻意不写** set_real_ip_from / real_ip_header，而且这条路是关死的、
#   不是「以后可以补上」。
#
#   实际拓扑：cloudflared 不在本 compose 里，它是 NAS 上一个独立容器
#   （SZ_NAS 隧道），按 http://172.25.5.162:8088 回源 —— 也就是走宿主机映射端口。
#   DSM 反向代理同样是打 8088。两者进到本 nginx 时，$remote_addr 都是网桥网关
#   172.20.0.1，**在 nginx 这一层根本区分不开**。所以无论把 set_real_ip_from
#   写成 /24 还是任何 /32，都必然同时放行 DSM 那条路径，校园网用户就能自己伪造
#   CF-Connecting-IP 绕开后端的登录限流。
#
#   不写也不影响限流：后端 rate_limiting.py 只在「直连 IP 是私网」时才信任
#   X-Forwarded-For 链的第一个地址；CF 边缘会把真实客户端 IP 放进 XFF，
#   cloudflared 与本 nginx 都用追加式的 $proxy_add_x_forwarded_for，
#   真实客户端 IP 始终在第一位。隧道后限流仍按真实 IP 生效。
#
#   实话一句：今天经 DSM -> 8088 这条路径的客户端本来就能伪造 XFF
#   （rate_limiting.py 的注释自己也承认）。隧道改造既没加重也没减轻这个问题，
#   评审时别把它当成新引入的风险。
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name media.sysu-sam.com;

    # media 域名只服务 GET / HEAD，不接受上传，所以 body 上限给小值即可。
    # 若将来（阶段四）把上传也移到 media 域名绕开 CF 的 100 MB 限制，这里要改回 6G。
    client_max_body_size 1m;

    large_client_header_buffers 4 32k;
    client_header_buffer_size 32k;

    # ---- CORS ----------------------------------------------------------
    # 只有字幕 VTT 与 HLS 播放列表真正需要 CORS：前者是
    # fetch(url, {credentials:'include'})，后者是 videojs 的 withCredentials XHR。
    # <video>/<img>/<iframe>/<a download> 都是 no-cors，不需要这些头。
    #
    # 后端 CORSMiddleware 在请求带 Origin 时**也会**下发同名头，两份叠加会让浏览器
    # 直接判 CORS 失败。所以先 proxy_hide_header 掐掉上游的，再由 nginx 统一补一份。
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin      "https://learn.sysu-sam.com" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods     "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Range, Content-Type, Authorization" always;
    add_header Access-Control-Expose-Headers    "Content-Length, Content-Range, Accept-Ranges" always;
    add_header Access-Control-Max-Age           "86400" always;
    # 上面这些 add_header 写在 server 级，下面任何 location 都不再写 add_header，
    # 否则会触发 nginx 的「同级覆盖」规则把这一整组头丢掉。

    # 预检直接在边缘回掉，不打后端。server 级的 if + return 是安全用法。
    # 非媒体路径的 OPTIONS 也会拿到 204，无害。
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ---- 重媒体：/api/v1/stream/ ---------------------------------------
    # stream.py 手写了完整的 Range 解析（206 / 416 / Content-Range / Accept-Ranges）。
    # 不要开 proxy_cache，也不要设 proxy_force_ranges；nginx 默认原样透传 Range 请求头
    # 与上游的 206 响应。proxy_buffering off 让首字节尽快到达播放器。
    location /api/v1/stream/ {
        proxy_pass http://learnhouse-app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 75s;
    }

    # ---- 重媒体：/content/ 下的视频 / PDF / 音频块 ----------------------
    # 这三条与上面 $media_path_hit 里的规则一一对应。用 location ~ 精确放行，
    # 而不是整个 /content/ 全放开 —— 后者会把作业提交文件也暴露到 media 域名上。
    # /content/ 不是裸 StaticFiles，local_content.py 每个请求都过鉴权，
    # 响应是 Starlette FileResponse，自带 Range 支持。
    # 签名参数（sig / exp / uid）在 query 里。下面两条 location 的 proxy_pass
    # 都不带 URI，nginx 会原样把 query 传给上游，签名能过。
    # ⚠️ 已知问题：签名参数会进 nginx 的 access log，等价于短期凭据落日志。
    # 本期不处理；要处理就在 log_format 里对 sig 做脱敏。
    location ~ ^/content/orgs/[^/]+/courses/[^/]+/activities/[^/]+/(video|documentpdf)/ {
        proxy_pass http://learnhouse-app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 75s;
    }

    location ~ ^/content/orgs/[^/]+/courses/[^/]+/activities/[^/]+/dynamic/blocks/(pdfBlock|videoBlock|audioBlock)/ {
        proxy_pass http://learnhouse-app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 75s;
    }

    # ---- 校园网可达性探测端点 ------------------------------------------
    # 前端的 useCampusNetwork hook 对这个地址做一次
    # no-cors GET 来判断「用户是不是在校园网」（后端只注册了 GET，HEAD 会拿到 405）。
    # **不要删**，删了校外提示永远不出现。
    location = /api/v1/health {
        proxy_pass http://learnhouse-app:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ---- 其余一律不暴露 -------------------------------------------------
    # 用 404 而不是 302 回 learn：302 会让「校外用户误开 media 链接」变成一次
    # 绕回 CF 的往返，反而掩盖问题；404 一眼看得出是走错域名了。
    location / {
        return 404;
    }
}
